# Atlas Solo — Türkçe Documenso imajı (upstream v2.16.0 + tr dili + imza sayfasında gönderen firma adı).
# Upstream iş akışları bu dalda kaldırıldı; yalnız bu iş çalışır. Çıktı:
#   ghcr.io/makturk/documenso:atlas-<kısa sha>   (değişmez; canlıda bu kullanılır)
#   ghcr.io/makturk/documenso:atlas-2.20.0-tr    (son derleme)
name: atlas-image

on:
  push:
    branches: ['atlas/**']
  workflow_dispatch:

concurrency:
  group: atlas-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/makturk/documenso:atlas-${{ steps.sha.outputs.short }}
            ghcr.io/makturk/documenso:atlas-2.20.0-tr
          cache-from: type=gha
          cache-to: type=gha,mode=max
