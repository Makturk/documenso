# Atlas — Documenso veritabanı imajı (docker/atlas-postgres/Dockerfile).
# Çıktı (herkese açık documenso paketinde, ayrı etiket önekiyle):
#   ghcr.io/makturk/documenso:atlas-postgres-<PG_TAG>-<YYYYMMDD>-<kısa sha>   (değişmez; canlıda bu kullanılır)
#   ghcr.io/makturk/documenso:atlas-postgres-<PG_TAG>              (son derleme)
# Haftalık yeniden derleme Debian güvenlik düzeltmelerini ve Go yamalarını toplar
# (zamanlanmış iş yalnız varsayılan daldan koşar). Canlıya alma elle — ATLAS.md.
name: atlas-postgres-image

on:
  push:
    branches: ['atlas/**']
    paths:
      - 'docker/atlas-postgres/**'
      - '.github/workflows/atlas-postgres-image.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: atlas-postgres-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PG_TAG: 15.20-trixie

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tarih
        id: date
        run: |
          echo "ymd=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: docker/atlas-postgres
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          build-args: |
            PG_TAG=${{ env.PG_TAG }}
          tags: |
            ghcr.io/makturk/documenso:atlas-postgres-${{ env.PG_TAG }}-${{ steps.date.outputs.ymd }}-${{ steps.date.outputs.sha }}
            ghcr.io/makturk/documenso:atlas-postgres-${{ env.PG_TAG }}
